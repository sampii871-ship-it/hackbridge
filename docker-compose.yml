services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: mysql+aiomysql://hackbridge:hackbridge@db:3306/hackbridge
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-before-deploy}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hackbridge
      MYSQL_USER: hackbridge
      MYSQL_PASSWORD: hackbridge
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-phackbridge"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data: